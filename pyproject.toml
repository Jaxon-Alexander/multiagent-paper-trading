[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-multiagent-paper-trading"
version = "0.1.0"
description = "Multi-agent research prototype for Alpaca paper holdings and market analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alpaca-py>=0.30,<1",
  "google-genai>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "jsonschema>=4.0,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
market-agents = "market_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
